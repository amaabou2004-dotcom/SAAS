name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Seuls les services utiles aux tests sont lancés : moins de conteneurs à
      # télécharger, donc un démarrage plus rapide et plus fiable en CI.
      - name: Démarrer Supabase local
        run: |
          pnpm exec supabase start --exclude studio,imgproxy,postgres-meta,realtime,edge-runtime,logflare,vector
      - run: pnpm test:db
      - run: pnpm test:db:concurrency
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
