project_id = "saas-commerce"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324
admin_email = "admin@example.test"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/verification",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/reinitialisation",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
# Minuscule, majuscule et chiffre obligatoires à chaque nouveau mot de passe.
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Votre code de vérification Stokari"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisation de votre mot de passe"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Vérifiez votre nouvelle adresse e-mail"
content_path = "./supabase/templates/email-change.html"

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false
